<!DOCTYPE html>
<html lang="en" class="authentication-page">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Hoard - Sign In</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico?v=2">
    <link rel="icon" type="image/png" sizes="64x64" href="images/favicon.png?v=2">
    <link rel="icon" type="image/png" href="images/logo.png?v=2">
    <script src="script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
        rel="stylesheet">
</head>

<body class="authentication-page">
    <div class="logo-display">
        <img src="images/authentication1logo.png" alt="Logo">
        <img src="images/authentication2logo.png" alt="logo">
    </div>
    <main class="authentication-menu">
        <div class="authentication" id="signin">
            <h1>Sign In</h1>
            <p>Welcome back! Please sign in to your account.</p>
            <form action="" id="signin-form" novalidate>
                <div class="email-container">
                    <label for="signin-email">Email</label>
                    <input type="email" id="signin-email" name="email" placeholder="you@university.edu"
                        autocomplete="email" required>
                </div>
                <div class="password-container">
                    <label for="signin-password">Password</label>
                    <input type="password" id="signin-password" name="password" placeholder="••••••••"
                        autocomplete="current-password" required>
                    <button type="button" class="togglePasswordBtn" aria-label="Show password"><img
                            src="images/hide-password.png" alt="hide password" class="hide-password-img"></button>
                </div>
                <div id="signin-feedback" class="auth-feedback" aria-live="polite"></div>
                <button class="btn" type="submit" id="signin-btn">Sign In</button>
            </form>
        </div>
        <div class="authentication" id="signup">
            <h1>Sign Up</h1>
            <p>Welcome! Please sign up to create an account.</p>
            <form action="" id="signup-form" novalidate>
                <div class="name-container">
                    <label for="signup-name">Name</label>
                    <input type="text" id="signup-name" name="name" placeholder="John Doe" autocomplete="name" required>
                </div>
                <div class="email-container">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" name="email" placeholder="you@university.edu"
                        autocomplete="email" required>
                </div>
                <div class="password-container">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" name="password" placeholder="••••••••"
                        autocomplete="new-password" required>
                    <button type="button" class="togglePasswordBtn" aria-label="Show password"><img
                            src="images/hide-password.png" alt="hide password" class="hide-password-img"></button>
                </div>
                <div class="password-container">
                    <label for="signup-confirm-password">Confirm Password</label>
                    <input type="password" id="signup-confirm-password" name="confirm-password" placeholder="••••••••"
                        autocomplete="new-password" required>
                    <button type="button" class="togglePasswordBtn" aria-label="Show password"><img
                            src="images/hide-password.png" alt="hide password" class="hide-password-img"></button>
                </div>
                <div id="signup-feedback" class="auth-feedback" aria-live="polite"></div>
                <button class="btn" role="button" type="submit" id="signup-btn">Sign Up</button>
            </form>
        </div>
        <div class="toggle-panel">
            <a class="toggle-btn" role="button" id="signup-toggle">Sign Up</a>
            <a class="toggle-btn" role="button" id="signin-toggle">Sign In</a>
        </div>
    </main>
    <div class="mascot-display">
        <img id="mascot" src="images/logo.png" alt="mascot">
    </div>
</body>

</html>
